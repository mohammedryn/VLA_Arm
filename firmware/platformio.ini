[env:teensy41]
platform      = teensy
board         = teensy41
framework     = arduino
build_flags   = -O2 -std=c++17
build_src_filter =
    -<*>
    +<ism330dhcx_driver.cpp>
    +<tof_driver.cpp>
    +<contact_oracle.cpp>
    +<sensor_safety/sensor_main.cpp>
lib_deps =
    Wire
    stm32duino/STM32duino VL53L5CX @ ^1.2.3
